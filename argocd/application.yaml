apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-lab-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<OWNER>/devops-lab.git
    targetRevision: main
    path: devops-lab-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true       # deletes what's removed from Git
      selfHeal: true    # reverts manual cluster drift
    syncOptions:
      - CreateNamespace=true
